[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    smoke: Critical post-deployment smoke tests on staging environment
    regression: Full regression test suite executed after plugin or core updates
    e2e: End-to-End business flow tests (contact forms, GDPR validation)
    mobile: Mobile responsiveness (RWD) and touch usability tests
    security: Baseline HTTP security headers and form sanitization checks
filterwarnings = ignore::pytest.PytestRemovedIn10Warning