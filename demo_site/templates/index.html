<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Web - WordPress Solutions & Automations</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { line-height: 1.6; color: #222; background: #f9fafb; }
        header { background: #111827; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .nav-links { display: flex; gap: 1.5rem; list-style: none; }
        .nav-links a { color: #fff; text-decoration: none; }
        .mobile-toggle { display: none; background: #374151; color: #fff; border: none; padding: 12px 16px; cursor: pointer; font-size: 16px; }
        .cta-phone { display: inline-block; background: #2563eb; color: #fff; padding: 12px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; min-height: 48px; min-width: 48px; }
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1.5rem; }
        .card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 2rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.4rem; font-weight: bold; }
        input[type="text"], input[type="email"], textarea { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 4px; }
        .checkbox-group { display: flex; align-items: flex-start; gap: 0.5rem; margin: 1rem 0; }
        button[type="submit"] { background: #16a34a; color: #fff; border: none; padding: 14px 24px; border-radius: 6px; font-size: 16px; cursor: pointer; min-height: 48px; }
        .alert { padding: 1rem; border-radius: 4px; margin-top: 1rem; display: none; }
        .alert-success { background: #dcfce7; color: #166534; }
        .alert-error { background: #fee2e2; color: #991b1b; }

        @media (max-width: 768px) {
            .mobile-toggle { display: block; }
            .nav-links { display: none; flex-direction: column; width: 100%; margin-top: 1rem; }
            .nav-links.active { display: flex; }
            header { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo"><strong>UT</strong> Demo Web</div>
        <button class="mobile-toggle" id="mobile-menu-btn" aria-label="Menu">☰ Menu</button>
        <ul class="nav-links" id="nav-menu">
            <li><a href="#services">Services</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </header>

    <div class="container">
        <div class="card" id="services">
            <h1>WordPress Websites & Custom Integrations</h1>
            <p style="margin: 1rem 0;">Fast deployments, full mobile responsiveness, and staging environment maintenance.</p>
            <a href="tel:+48718808261" class="cta-phone" id="header-phone-link">Call Us: +48 71 880 82 61</a>
        </div>

        <div class="card" id="contact">
            <h2>Contact Form</h2>
            <form id="contact-form" novalidate>
                <div class="form-group">
                    <label for="full_name">Full Name *</label>
                    <input type="text" id="full_name" name="full_name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" name="phone">
                </div>
                <div class="form-group">
                    <label for="message">Message *</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="gdpr_consent" name="gdpr_consent">
                    <label for="gdpr_consent" style="font-weight: normal;">I consent to the processing of my personal data (GDPR) for the purpose of responding to my inquiry. *</label>
                </div>
                <button type="submit" id="submit-btn">Send Message</button>
                <div id="form-feedback" class="alert" role="alert"></div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            document.getElementById('nav-menu').classList.toggle('active');
        });

        document.getElementById('contact-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const feedback = document.getElementById('form-feedback');
            feedback.style.display = 'none';

            const payload = {
                full_name: document.getElementById('full_name').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                message: document.getElementById('message').value.trim(),
                gdpr_consent: document.getElementById('gdpr_consent').checked
            };

            if (!payload.gdpr_consent) {
                feedback.textContent = "Error: Please accept the required GDPR consent.";
                feedback.className = "alert alert-error";
                feedback.style.display = "block";
                return;
            }

            try {
                const res = await fetch('/wp-json/contact/v1/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (res.ok) {
                    feedback.textContent = data.message;
                    feedback.className = "alert alert-success";
                    document.getElementById('contact-form').reset();
                } else {
                    feedback.textContent = "Validation error in the submitted form.";
                    feedback.className = "alert alert-error";
                }
            } catch (err) {
                feedback.textContent = "Server connection error.";
                feedback.className = "alert alert-error";
            }
            feedback.style.display = "block";
        });
    </script>
</body>
</html>
